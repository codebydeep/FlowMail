server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods: ["GET","POST","PUT","DELETE","OPTIONS","PATCH"]
            allowedHeaders: ["*"]
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: email-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/emails/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        - id: calendar-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/calendar/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        - id: ai-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        - id: integration-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/integrations/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        - id: notification-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/notifications/**,/ws/**
          filters:
            - StripPrefix=0

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production-min-256-bits}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**

        - id: email-service
          uri: http://email-service:8082
          predicates:
            - Path=/api/emails/**
          filters:
            - name: JwtAuthFilter

        - id: calendar-service
          uri: http://calendar-service:8083
          predicates:
            - Path=/api/calendar/**
          filters:
            - name: JwtAuthFilter

        - id: ai-service
          uri: http://ai-service:8084
          predicates:
            - Path=/api/ai/**
          filters:
            - name: JwtAuthFilter

        - id: integration-service
          uri: http://integration-service:8085
          predicates:
            - Path=/api/integrations/**
          filters:
            - name: JwtAuthFilter

        - id: notification-service
          uri: http://notification-service:8086
          predicates:
            - Path=/api/notifications/**,/ws/**
