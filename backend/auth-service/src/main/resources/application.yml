server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/flowmail_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: flowmail
    password: flowmail_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password: flowmail_redis

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production-min-256-bits}
  access-token-expiry-ms: 900000        # 15 minutes
  refresh-token-expiry-ms: 2592000000   # 30 days

management:
  endpoints:
    web:
      exposure:
        include: health,info
