server:
  port: 8083

spring:
  application:
    name: calendar-service
  datasource:
    url: jdbc:mysql://localhost:3306/flowmail_calendar?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: flowmail
    password: flowmail_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
      password: flowmail_redis
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

services:
  integration-url: http://localhost:8085

management:
  endpoints:
    web:
      exposure:
        include: health,info
